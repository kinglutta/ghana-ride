services:
  - type: web
    name: yenkoroide-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: FRONTEND_URL
        value: https://yenkoroide.vercel.app
      - key: ADMIN_SIGNUP_CODES
        sync: false
    autoDeploy: true
    branch: main
    rootDir: Backend

# MongoDB is provided separately by MongoDB Atlas. Render does not provide a
# managed MongoDB database here, so MONGODB_URL is supplied as a secret above.
