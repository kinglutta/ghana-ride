services:
  - type: web
    name: yenkoroide-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: FRONTEND_URL
        value: https://yenkoroide.vercel.app
    autoDeploy: true
    branch: main
    rootDir: Backend

databases:
  - name: yenkoroide-mongodb
    databaseName: yenkoroide
    user: yenkoroide_admin
    plan: free
# Environment Variables to set in Render Dashboard:
# MONGODB_URL: mongodb+srv://username:password@cluster.mongodb.net/yenkoroide
# JWT_SECRET: your-super-secret-jwt-key-minimum-32-characters
